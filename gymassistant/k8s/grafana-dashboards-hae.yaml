# Готовые дашборды проекта health-auto-export-server (HealthyApps), как есть.
#
# Свои писать незачем: апстрим их поддерживает, и они ходят прямо в REST API
# hae-server через плагин Infinity — без нашей таблицы и без синхронизатора.
# Наш дашборд (grafana-dashboard-gym.yaml) их не дублирует, а закрывает то,
# чего они не могут: связь здоровья с ТРЕНИРОВКАМИ, которые лежат в Postgres.
#
# Два дашборда зашивают uid источника (bee4k1otx5urkf), поэтому Infinity
# заводится ровно с этим uid — иначе панели пришлось бы править руками.
# У третьего uid был подстановкой __inputs (так Grafana экспортирует «для
# импорта»); подставлен тот же, а блок __inputs убран — при провижининге
# файлом спрашивать некого.
#
# ВНИМАНИЕ: дашборды про тренировки (Workouts) будут пустыми, пока в приложении
# не заведена ОТДЕЛЬНАЯ автоматизация с Data Type: Workouts — коллекция workouts
# в Mongo сейчас пуста.
