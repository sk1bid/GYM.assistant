name: deploy bot

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: gymassistant
        run: |
          python -m pip install --upgrade pip
          # Bot deps (the rest-notifier test imports aiogram) + Mini App deps,
          # plus the test-only tools that no service pins.
          pip install -r requirements.txt -r requirements-miniapp.txt
          pip install pytest==8.3.3 pytest-asyncio==0.24.0 httpx==0.27.2

      - name: Run tests
        working-directory: gymassistant
        run: pytest tests/ -q

  deploy:
    runs-on: ubuntu-latest
    # Never ship a red build: a push to main is a production deploy.
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Determine Tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE_TAG=$( [ "${{ github.ref_name }}" = "main" ] && echo "prod" || echo "dev" )
          TAG="${BASE_TAG}-$SHORT_SHA"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          REPO="ghcr.io/${{ github.repository }}"
          echo "REPO=$REPO" >> $GITHUB_ENV

      - name: Build and push BOT
        uses: docker/build-push-action@v5
        with:
          context: gymassistant/
          file: gymassistant/Dockerfile
          push: true
          tags: ${{ env.REPO }}:bot-${{ env.TAG }},${{ env.REPO }}:bot-${{ env.BASE_TAG }}
          cache-from: type=registry,ref=${{ env.REPO }}:bot-buildcache
          cache-to: type=registry,ref=${{ env.REPO }}:bot-buildcache,mode=max

      - name: Build and push MINIAPP
        uses: docker/build-push-action@v5
        with:
          context: gymassistant/
          file: gymassistant/Dockerfile.miniapp
          push: true
          tags: ${{ env.REPO }}:miniapp-${{ env.TAG }},${{ env.REPO }}:miniapp-${{ env.BASE_TAG }}
          cache-from: type=registry,ref=${{ env.REPO }}:miniapp-buildcache
          cache-to: type=registry,ref=${{ env.REPO }}:miniapp-buildcache,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          # Дефолтные 10 минут кончались раньше, чем kubectl переставал ждать поды,
          # и шаг падал с «Run Command Timeout» — то есть без единого слова о том,
          # что именно не поднялось. Теперь таймауты стоят внутри скрипта, на каждом
          # ожидании отдельно, а этот — только внешняя страховка.
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO="ghcr.io/${{ github.repository }}"
            TAG=${{ env.TAG }}
            BASE_TAG=${{ env.BASE_TAG }}
            NAMESPACE=$( [ "${{ github.ref_name }}" = "main" ] && echo "gym-prod" || echo "gym-dev" )

            export KUBECONFIG=~/.kube/config
            echo "Deploying to namespace $NAMESPACE"

            # The manifests live in the repo checkout on the server, one directory
            # below home. Without this cd the apply paths resolved to a non-existent
            # location, the apply silently errored, and `set image` shipped a new tag
            # onto a stale (test/dev) spec — half a deploy. cd + set -e makes a missing
            # manifest abort loudly instead.
            cd ~/gymassistant
            # Best-effort refresh so the manifests match the built commit; never fail
            # the deploy if the working copy can't fast-forward.
            git fetch --quiet origin main && git merge --ff-only --quiet origin/main \
              || echo "warning: repo not fast-forwarded; applying on-disk manifests"

            # Schema first, pods second. The app refuses to start on a database that
            # lags the models (create_db in database/engine.py), so shipping the image
            # before the migration means two CrashLoopBackOff pods and a deploy that
            # waits for them until it times out — which is exactly what aecce59 did.
            # The Job runs the freshly built image: the running pods carry only the
            # migrations of their own commit.
            echo "Running migrations"
            kubectl delete job gym-migrate -n $NAMESPACE --ignore-not-found --wait=true
            sed "s|__IMAGE__|$REPO:bot-$TAG|" gymassistant/k8s/migrate-job.yaml \
              | kubectl apply -n $NAMESPACE -f -

            # Not `kubectl wait --for=condition=complete`: on a failed job that waits
            # out the whole timeout instead of reporting the failure. Each condition
            # is read by name — a job carries several at once (SuccessCriteriaMet
            # arrives alongside Complete), so asking for "the true ones" gives a list,
            # never the single word we would compare against.
            DONE=""
            for _ in $(seq 60); do
              DONE=$(kubectl get job gym-migrate -n $NAMESPACE \
                -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' || true)
              FAILED=$(kubectl get job gym-migrate -n $NAMESPACE \
                -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' || true)
              if [ "$DONE" = "True" ] || [ "$FAILED" = "True" ]; then
                break
              fi
              sleep 5
            done

            kubectl logs job/gym-migrate -n $NAMESPACE --tail=40 || true
            if [ "$DONE" != "True" ]; then
              echo "Migrations did not finish; nothing was deployed"
              kubectl describe job gym-migrate -n $NAMESPACE | tail -20 || true
              exit 1
            fi

            # Manifests carry a floating tag (:bot-prod), and imagePullPolicy is
            # IfNotPresent — so a plain apply pins the pods to whatever stale layer
            # the node happens to have cached, and starts a rollout on it before
            # `set image` can correct the tag. Substituting the sha here makes the
            # apply itself the deploy: one spec update, one wave, no window on old
            # code. That is also why there is no `rollout restart` — the changed tag
            # already rolls the pods.
            sed "s|:bot-prod$|:bot-$TAG|" gymassistant/k8s/bot-prod.yaml \
              | kubectl apply -n $NAMESPACE -f -
            sed "s|:miniapp-prod$|:miniapp-$TAG|" gymassistant/k8s/miniapp-prod.yaml \
              | kubectl apply -n $NAMESPACE -f -

            # Перенос метрик Apple Health. Тег подставляется по той же причине,
            # что и выше: с плавающим :bot-prod и IfNotPresent ночной запуск взял
            # бы закэшированный узлом слой, а не тот код, что только что собрали.
            # Ждать нечего — CronJob ничего не выкатывает, он просто расписание.
            sed "s|:bot-prod$|:bot-$TAG|" gymassistant/k8s/health-sync-cronjob.yaml \
              | kubectl apply -n $NAMESPACE -f -

            # Bounded waits, and the pod's own log on failure — a bare timeout says
            # nothing about the reason.
            for DEPLOY in gym-bot gym-miniapp; do
              if ! kubectl rollout status deploy/$DEPLOY -n $NAMESPACE --timeout=240s; then
                echo "$DEPLOY did not roll out:"
                kubectl logs deploy/$DEPLOY -n $NAMESPACE --all-containers --tail=40 || true
                kubectl describe deploy/$DEPLOY -n $NAMESPACE | tail -20 || true
                exit 1
              fi
            done

            echo "Deployment complete!"
